services:
  postgres:
    image: postgres:17
    container_name: augur-postgres
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: augur-backend
    restart: unless-stopped

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"
    
    volumes:
      - .:/app

volumes:
  postgres_data: